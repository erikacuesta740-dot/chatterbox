# Publica el juego (carpeta manager/) en GitHub Pages.
# Activación (una vez): Settings → Pages → Source: «GitHub Actions». Después se publica en cada cambio
# de manager/ en la rama principal, o a mano desde la pestaña Actions («Run workflow»).
name: Publicar Modo Carrera Manager
on:
  push:
    branches: [main, master]
    paths: ['manager/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: manager
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: manager
      - id: deployment
        uses: actions/deploy-pages@v4
